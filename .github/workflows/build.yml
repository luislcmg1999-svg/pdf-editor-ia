name: build-exe
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "pdf-editor-pc(1)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run offline
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: editor-pdf-exe
          path: "pdf-editor-pc(1)/dist/*.exe"
